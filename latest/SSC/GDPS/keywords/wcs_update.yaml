%YAML 1.1
---
$schema: asdf://stsci.edu/datamodels/roman/schemas/rad_schema-1.0.0
id: asdf://stsci.edu/datamodels/roman/schemas/SSC/GDPS/keywords/wcs_update-1.0.0

title: GDPS WCS update keywords
extName: SSC
type: object
properties:
  delta_ra:
    title: delta_ra
    description: Shift in RA, in units of deg
    type: number
    archive_catalog:
      datatype: float
      destination: [WFISpec.delta_ra]
  delta_dec:
    title: delta_dec
    description: Shift in Declination, in units of deg
    type: number
    archive_catalog:
      datatype: float
      destination: [WFISpec.delta_dec]
  std_ra:
    title: std_ra
    description: Standard deviation for RA, in units of deg.
    type: number
    archive_catalog:
      datatype: float
      destination: [WFISpec.std_ra]
  std_dec:
    title: std_dec
    description: Standard deviation for the Declination, in units of deg.
    type: number
    archive_catalog:
      datatype: float
      destination: [WFISpec.std_dec]
  delta_pa:
    title: delta_pa
    description: Shift in rotation, in units of deg.
    type: number
    archive_catalog:
      datatype: float
      destination: [WFISpec.delta_pa]
  std_pa:
    title: std_pa
    description: Standard deviation for rotation, in units of deg.
    type: number
    archive_catalog:
      datatype: float
      destination: [WFISpec.std_pa]
  nsrc_used:
    title: nsrc_used
    description: The number of sources used to get the WCSUpdate solution.
    type: integer
    archive_catalog:
      datatype: int
      destination: [WFISpec.nsrc_used]
required: [delta_ra, delta_dec, std_ra, std_dec, delta_pa, std_pa, nsrc_used]
