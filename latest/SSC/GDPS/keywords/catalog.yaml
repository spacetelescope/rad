%YAML 1.1
---
$schema: asdf://stsci.edu/datamodels/roman/schemas/rad_schema-2.0.0
id: asdf://stsci.edu/datamodels/roman/schemas/SSC/GDPS/keywords/catalog-1.0.0

title: GDPS catalog keywords
extName: SSC
type: object
properties:
  catalog_id:
    title: Catalog ID
    description: ID of the G1DP catalog run that created the G1DP file(s).  Example value '42'
    type: integer
    archive_catalog:
      datatype: int
      destination: [WFISpecCatalog.catalog_id]
  file_number:
    title: File Number
    description: Sequence number of this file within a multi-file catalog set, used for unique filenames.  Example value '1'
    type: integer
    archive_catalog:
      datatype: int
      destination: [WFISpecCatalog.file_number]
required: [catalog_id, file_number]
