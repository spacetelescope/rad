%YAML 1.1
---
$schema: asdf://stsci.edu/datamodels/roman/schemas/rad_schema-2.0.0
id: asdf://stsci.edu/datamodels/roman/schemas/SSC/GDPS/keywords/g2dp_common-1.0.0

title: G2DP common keywords
extName: SSC
type: object
properties:
  version_g2dp_software:
    title: G2DP Software Version
    description: Version of the G2DP software (roman-gdps-g2dp repo).  Example value '4.1.0'
    type: string
    maxLength: 128
    archive_catalog:
      datatype: nvarchar(128)
      destination:
        [WFISpec.version_g2dp_software, WFISpecLocation.version_g2dp_software]
  g2dp_run_id:
    title: G2DP Run ID
    description: ID of the G2DP run that created the G2DP file(s).  Example value '42'
    type: integer
    archive_catalog:
      datatype: int
      destination: [WFISpec.g2dp_run_id, WFISpecLocation.g2dp_run_id]
  cdp_ctx:
    title: CDP Context
    description: GDPS Calibration Data Pipeline Context for spectral calibration files used for spectral processing.  Example value '2'
    type: integer
    archive_catalog:
      datatype: int
      destination: [WFISpec.cdp_ctx, WFISpecLocation.cdp_ctx]
  wcs_field_center_ra:
    title: Field Center RA
    description: Right Ascension (deg) of the exposure's target position (pointing.target_ra), corrected by the G2DP WCS update. The same for all detectors in the exposure. The J2000 Earth Centered Inertial (ECI) frame is used.  Example value '270.0'
    type: number
    archive_catalog:
      datatype: float
      destination:
        [WFISpec.wcs_field_center_ra, WFISpecLocation.wcs_field_center_ra]
  wcs_field_center_dec:
    title: Field Center Dec
    description: Declination (deg) of the exposure's target position (pointing.target_dec), corrected by the G2DP WCS update. The same for all detectors in the exposure. The J2000 Earth Centered Inertial (ECI) frame is used.  Example value '66.0'
    type: number
    archive_catalog:
      datatype: float
      destination:
        [WFISpec.wcs_field_center_dec, WFISpecLocation.wcs_field_center_dec]
required:
  [
    version_g2dp_software,
    g2dp_run_id,
    cdp_ctx,
    wcs_field_center_ra,
    wcs_field_center_dec,
  ]
