%YAML 1.1
---
$schema: asdf://stsci.edu/datamodels/roman/schemas/rad_schema-2.0.0
id: asdf://stsci.edu/datamodels/roman/schemas/SSC/ssc_basic-1.0.0

title: Basic keywords across all SSC file types

# Note: These keywords are automatically added to the ingest manifest
# by the SOC's SSC file receipt lambda.  SSC does NOT need to include
# these in the 'metadata' object of the data availability notification.
# These are a subset of the RAD basic keywords (https://github.com/spacetelescope/rad/blob/main/latest/basic.yaml)

extName: SSC

type: object
properties:
  filename:
    title: File Name
    description: |
      The filename as taken from the 'filename' property of the data availability notification.
    type: string
    maxLength: 1024
    archive_catalog:
      datatype: nvarchar(1024)
      destination:
        [
          CGIExposure.filename,
          CGIMosaic.filename,
          CGIAncillary.filename,
          WFIMSOSReferenceFrame.filename,
          WFIMSOSCatalog.filename,
          WFIMSOSDetectionEfficiencyCatalog.filename,
          WFIMSOSDQA.filename,
          WFIMSOSEventsDQA.filename,
          WFISpec.filename,
          WFISpecCatalog.filename,
          WFISpecLocation.filename,
        ]
  file_date:
    title: File Creation Date (UTC)
    description: |
      The file creation date as taken from the 'fileCreationTimestamp'
      property of the data availability notification.
    allOf:
      - $ref: http://stsci.edu/schemas/asdf/time/time-1.3.0#/definitions/iso_time
    archive_catalog:
      datatype: datetime2
      destination:
        [
          CGIExposure.filedate,
          CGIMosaic.filedate,
          CGIAncillary.filedate,
          WFIMSOSReferenceFrame.filedate,
          WFIMSOSCatalog.filedate,
          WFIMSOSDQA.filedate,
          WFIMSOSEventsDQA.filedate,
          WFIMSOSDetectionEfficiencyCatalog.filedate,
          WFISpec.filedate,
          WFISpecCatalog.filedate,
          WFISpecLocation.filedate,
        ]
  instrument:
    title: Instrument
    description: Instrument shorthand.
    type: string
    maxLength: 8
    archive_catalog:
      datatype: nvarchar(8)
      destination:
        [
          CGIExposure.instrument_name,
          CGIMosaic.instrument_name,
          CGIAncillary.instrument_name,
          WFIMSOSReferenceFrame.instrument_name,
          WFIMSOSCatalog.instrument_name,
          WFIMSOSDQA.instrument_name,
          WFIMSOSEventsDQA.instrument_name,
          WFIMSOSDetectionEfficiencyCatalog.instrument_name,
          WFISpec.instrument_name,
          WFISpecCatalog.instrument_name,
          WFISpecLocation.instrument_name,
        ]
  origin:
    title: Institution / Organization Name
    description: |
      The name of the institution or organization responsible for creating this file.
    type: string
    maxLength: 15
    archive_catalog:
      datatype: nvarchar(15)
      destination:
        [
          CGIExposure.origin,
          CGIMosaic.origin,
          CGIAncillary.origin,
          WFIMSOSReferenceFrame.origin,
          WFIMSOSCatalog.origin,
          WFIMSOSDQA.origin,
          WFIMSOSEventsDQA.origin,
          WFIMSOSDetectionEfficiencyCatalog.origin,
          WFISpec.origin,
          WFISpecCatalog.origin,
          WFISpecLocation.origin,
        ]

required: [filename, file_date, instrument, origin]
