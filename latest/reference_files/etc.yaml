%YAML 1.1
---
$schema: asdf://stsci.edu/datamodels/roman/schemas/rad_schema-2.0.0
id: asdf://stsci.edu/datamodels/roman/schemas/reference_files/etc-2.1.0

title: Exposure Time Calculator Reference File Schema

datamodel_name: EtcRefModel

type: object
properties:
  meta:
    allOf:
      - $ref: asdf://stsci.edu/datamodels/roman/schemas/reference_files/ref_common-2.0.0
      - type: object
        properties:
          reftype:
            type: string
            enum: [ETC]
  form:
    type: object
    properties:
      cosmic_rays_on:
        title: Cosmic Rays Flag
        description: |
          When set to 'True', cosmic rays are considered in the ETC engine in the noise calculation by default.
        type: boolean
      dark_current:
        title: Dark Current
        description: |
          Median dark value in electrons/s.
        type: number
      dark_current_on:
        title: Dark Current Flag
        description: |
          When set to 'True', the ETC engine will consider dark current in the noise calculation by default.
        type: boolean
      det_type:
        title: Detector Type
        description: |
          Detector type of the WFI. The value is h4rg-10 for Roman.
        type: string
      flat_field_electrons:
        title: Flat Field Electrons
        description: |
          Total number of electrons in the superflat. Used to determine the flat fielding error by the ETC.
        type: integer
      flat_field_noise_on:
        title: Flat Field Noise Flag
        description: |
          When set to 'True', flat field noise is considered in the ETC engine in the noise calculation by default.
        type: boolean
      inter_pixel_correlation_on:
        title: Inter Pixel Correlation Flag
        description: |
          When set to 'True', IPC convolution is considered in the ETC engine in the noise calculation by default.
        type: boolean
      ktc_noise:
        title: Thermal Reset Noise
        description: |
          special additive noise in electrons for the nresultants = 1 for Roman.
        type: number
      minresultants:
        title: Minimnum Number of Unsaturated Resultants
        description: |
          Minimum number of unsaturated resultants below which a pixel is said to be fully saturated.
        type: integer
      pix_size_x:
        title: Pixel Size in x-direction
        description: |
          Pixel size in microns. Used in cosmic ray calculation by the ETC engine. The value is 10 for Roman.
        type: integer
      pix_size_y:
        title: Pixel Size in y-direction
        description: |
          Pixel size in microns. Used in cosmic ray calculation by the ETC engine. The value is 10 for Roman.
        type: integer
      pixels_x:
        title: Number of Pixels in x-direction
        description: |
          Number of pixels in the detector. The value is 4088 for Roman.
        type: integer
      pixels_y:
        title: Number of Pixels in y-direction
        description: |
          Number of pixels in the detector. The value is 4088 for Roman.
        type: integer
      qyield_noise_excess_scaling:
        title: Quantum Yield Scaling Factor
        description: |
          A scaling factor for the quantum yield.
        type: number
      readnoise:
        title: Readnoise
        description: |
          Median single read noise value in electrons.
        type: number
      readnoise_correlation_on:
        title: Readnoise Correlation Flag
        description: |
          When set to 'True', the readnoise is considered as correlated in the ETC engine in the noise calculation by default. In this case, the engine requires a correlation matrix in place.
        type: boolean
      readnoise_excess_additive_on:
        title: Excess Readnoise Flag
        description: |
          When set to 'True', excess noise is considered in the ETC engine in the noise calculation by default.
        type: boolean
      readnoise_excess_additive_p1:
        title: Second-order Quadratic Correction Term to the Readnoise
        description: |
          An additional parameter used as a quadratic correction to the noise term. This is the second-order term.
        type: number
      readnoise_excess_additive_p2:
        title: first-order Quadratic Correction Term to the Readnoise
        description: |
          An additional parameter used as a quadratic correction to the noise term. This is the first-order term.
        type: number
      readnoise_excess_scaling:
        title: Readnoise Scaling Factor
        description: |
          Readnoise fudge factor. Multiplies by readnoise.
        type: number
      readnoise_on:
        title: Readnoise Flag
        description: |
          When set to 'True', readnoise is considered in the ETC engine in the noise calculation by default.
        type: boolean
      report_counts:
        title: Report in Counts Flag
        description: |
          When set to 'True', the ETC engine reports outputs in counts/s instead of electrons/s.
        type: boolean
      saturation_fullwell:
        title: Saturation Fullwell Depth 
        description: |
          Typical fullwell depth. Used to determine the saturation by the ETC
        type: integer
      saturation_on:
        title: Saturation Flag
        description: |
          When set to 'True', the ETC engine computes pixel saturation by default.
        type: boolean
      scattering_on:
        title: Detector Scattering Flag
        description: |
          When set to 'True', detector scattering is considered in the ETC engine in the noise calculation by default.
        type: boolean

required: [meta, form]
flowStyle: block
propertyOrder: [meta, form]
